# ============================================
# RabbitMQ 配置
# ============================================

spring:
  rabbitmq:
    # 连接配置
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    
    # 连接池配置
    cache:
      connection:
        size: 10
      channel:
        size: 25
        checkout-timeout: 30000
    
    # 监听器配置
    listener:
      simple:
        # 确认模式：manual（手动确认）
        acknowledge-mode: manual
        # 最小消费者数量
        concurrency: 3
        # 最大消费者数量
        max-concurrency: 10
        # 预取数量（每次最多处理的消息数）
        prefetch: 5
        # 重试配置
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          max-interval: 10000ms
          multiplier: 2.0
    
    # 发送者确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    
    # 队列配置（与 RabbitMQConfig 中的常量保持一致）
    queue:
      customer-conversion: crm.customer.conversion.queue
      notification: crm.notification.queue
      contract-expire: crm.contract.expire.queue

# ============================================
# 日志配置
# ============================================
logging:
  level:
    com.crm.system.mq: DEBUG
    org.springframework.amqp: INFO
